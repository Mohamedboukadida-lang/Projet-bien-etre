spring.application.name=ai-service
server.port=${PORT:8081}

# --- Hugging Face Inference Providers -------------------------------------
# Create a token at https://huggingface.co/settings/tokens (fine-grained, with
# "Make calls to Inference Providers") and export it as HF_TOKEN. Never commit it.
huggingface.token=${HF_TOKEN:}
huggingface.base-url=${HF_BASE_URL:https://router.huggingface.co}
# Any chat model served by Inference Providers works. Gated models (e.g. Llama)
# require accepting their licence on huggingface.co with the token's account.
huggingface.chat-model=${HF_CHAT_MODEL:meta-llama/Llama-3.1-8B-Instruct}
huggingface.caption-model=${HF_CAPTION_MODEL:Salesforce/blip-image-captioning-large}
huggingface.qa-model=${HF_QA_MODEL:deepset/roberta-base-squad2}
huggingface.max-tokens=${HF_MAX_TOKENS:512}
huggingface.temperature=0.7
huggingface.connect-timeout=10s
huggingface.read-timeout=60s

# Comma-separated list of origins allowed to call the API from a browser (Flutter web).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health
