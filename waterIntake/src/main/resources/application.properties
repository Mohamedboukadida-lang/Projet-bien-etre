spring.application.name=waterIntake
server.port=${PORT:8082}

# MongoDB connection. The default matches docker-compose.yml at the repository root.
spring.mongodb.uri=${MONGODB_URI:mongodb://rootuser:rootpass@localhost:27017/waterintake?authSource=admin}

# Comma-separated list of origins allowed to call the API from a browser (Flutter web).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# The app has no real login yet: this user is created on startup if missing and is
# the id used by the Flutter app (see mobileapp/lib/config/api_config.dart).
app.demo-user.id=${DEMO_USER_ID:66036b08fe2d6569e5efbb5c}
app.demo-user.daily-goal=2.5

management.endpoints.web.exposure.include=health
