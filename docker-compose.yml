# Starts the whole back-end: MongoDB, the water-intake service and the AI service.
#   cp .env.example .env   # then put your Hugging Face token in .env
#   docker compose up --build
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-rootuser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-rootpass}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  water-intake:
    build: ./waterIntake
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-rootuser}:${MONGO_PASSWORD:-rootpass}@mongo:27017/waterintake?authSource=admin
    ports:
      - "8082:8082"

  ai-service:
    build: ./back-end
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_CHAT_MODEL: ${HF_CHAT_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
    ports:
      - "8081:8081"

volumes:
  mongo-data:
